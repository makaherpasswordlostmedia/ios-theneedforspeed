              operator uint32_t() const { return (uint32_t)(uintptr_t)pthread_getspecific(key()); }
              TlsSite& operator=(uint32_t v) { pthread_setspecific(key(), (void*)(uintptr_t)v); return *this; }
          };
          static TlsSite t_site;"""
          if old in s: open(p, 'w').write(s.replace(old, new)); print("patched thread_local in pf_os.cpp")
          else: print("::warning::thread_local line not found in pf_os.cpp")
          PYEOF
          # the runtime sources, wherever 3dokit keeps them (layout not known to this workflow's author)
          find 3dokit build/recomp -name '*.cpp' -o -name '*.h' -o -name 'CMakeLists.txt' | sort > "$WORK/diag/files.txt"
          grep -rl 'SDL' 3dokit build/recomp --include='*.cpp' --include='*.h' > "$WORK/diag/sdl-users.txt" || true
          grep -rn 'int main *(' 3dokit build/recomp --include='*.cpp' > "$WORK/diag/mains.txt" || true
          cat build/recomp/CMakeLists.txt > "$WORK/diag/recomp-CMakeLists.txt" 2>/dev/null || true
          wc -l "$WORK"/diag/*.txt
          echo "::group::files.txt";            cat "$WORK/diag/files.txt";            echo "::endgroup::"
          echo "::group::mains.txt";            cat "$WORK/diag/mains.txt";            echo "::endgroup::"
          echo "::group::sdl-users.txt";        cat "$WORK/diag/sdl-users.txt";        echo "::endgroup::"
          echo "::group::recomp-CMakeLists.txt"; cat "$WORK/diag/recomp-CMakeLists.txt"; echo "::endgroup::"
          for f in $(cut -d: -f1 "$WORK/diag/mains.txt" "$WORK/diag/sdl-users.txt" | sort -u); do
            echo "::group::SDL/func lines in $f ($(wc -l < "$f") lines)"
            grep -n -E 'SDL_|^[A-Za-z_][A-Za-z0-9_:<>\*& ]* [A-Za-z_][A-Za-z0-9_:]*\(.*\) *(const)? *\{?$|^#include' "$f" | head -250 || true
            echo "::endgroup::"
          done
          echo "::group::recomp report.txt"; head -60 build/recomp/report.txt 2>/dev/null || true; echo "::endgroup::"
          R=3dokit/runtime
          for f in $R/runtime.cmake $R/pf_window.cpp $R/pf_main.cpp; do
            echo "::group::FULL $f"; cat "$f"; echo "::endgroup::"
          done
          echo "::group::pf.h ($(wc -l < $R/pf.h) lines): window/pad/audio/vbl/frame lines"
          grep -n -i -E 'window|audio|vbl|pad|frame|present|hook|namespace|std::function' $R/pf.h | head -150 || true
          echo "::endgroup::"
          echo "::group::C++ features used by the runtime"
          grep -rnE 'std::(optional|variant|string_view|filesystem|span|bit_cast|popcount|countl_zero|countr_zero|format|ranges|jthread)|<(bit|span|filesystem|optional|string_view|variant|format|ranges)>|thread_local|\brequires\b|\bconcept\b|std::atomic|std::thread|std::mutex|aligned_alloc|__builtin_' $R | cut -c1-170 | head -120 || true
          echo "::endgroup::"
          if [ -f "$P/core/nfs_core_glue.cpp" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::core/nfs_core_glue.cpp is not written yet: pfboot (SDL3) is not wired to host/nfs_host.h. Download the 'diagnostics' artifact and send it back; the Theos build is skipped until then."
          fi

      - name: Install Theos + iOS toolchain
        if: steps.glue.outputs.ready == 'true'
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain/linux/iphone" "$THEOS/sdks"
          curl -fsSL "https://github.com/L1ghtmann/llvm-project/releases/download/main-update_3-eabca92/iOSToolchain-x86_64.tar.xz" -o /tmp/tc.tar.xz
          tar -xf /tmp/tc.tar.xz -C "$THEOS/toolchain"
          curl -fsSL -o /tmp/sdk.tbz2 "https://raw.githubusercontent.com/Sn0wCooder/theos-sdks/master/iPhoneOS9.3.sdk.tbz2"
          tar -xjf /tmp/sdk.tbz2 -C "$THEOS/sdks"
          SDK="$THEOS/sdks/iPhoneOS9.3.sdk"
          for fw in "$SDK"/System/Library/Frameworks/*.framework; do
            if [ -f "$fw/module.map" ]; then mkdir -p "$fw/Modules"; mv "$fw/module.map" "$fw/Modules/module.modulemap"; fi
          done
          find "$SDK/usr/include" -name module.map | while read -r m; do mv "$m" "$(dirname "$m")/module.modulemap"; done
          # the toolchain ships a modern libc++ (<bit>, <filesystem>...) but not its generated __config_site
          CXXH="$THEOS/toolchain/linux/iphone/include/c++/v1"
          if [ -d "$CXXH" ] && [ ! -f "$CXXH/__config_site" ]; then
          cat > "$CXXH/__config_site" <<'SITE'
          #ifndef _LIBCPP___CONFIG_SITE
          #define _LIBCPP___CONFIG_SITE
          #define _LIBCPP_ABI_VERSION 1
          #define _LIBCPP_ABI_NAMESPACE __1
          #define _LIBCPP_HAS_THREAD_API_PTHREAD
          #define _LIBCPP_HAS_NO_VENDOR_AVAILABILITY_ANNOTATIONS
          #define _LIBCPP_HARDENING_MODE_DEFAULT _LIBCPP_HARDENING_MODE_NONE
          #define _LIBCPP_PSTL_BACKEND_SERIAL
          #define _LIBCPP_PSTL_CPU_BACKEND_SERIAL
          #define _LIBCPP_DISABLE_EXTERN_TEMPLATE
          #endif
          SITE
          fi
          echo "::group::toolchain libc++ info"
          "$THEOS/toolchain/linux/iphone/bin/clang++" --version || true
          grep -m3 -E "define _LIBCPP_VERSION|define _LIBCPP_ABI_VERSION" "$CXXH/__config" || true
          ls "$CXXH" | head -20; ls "$CXXH" | wc -l
          find "$THEOS/toolchain" "$THEOS/sdks" \( -name 'libc++*' -o -name 'libc++abi*' \) | head -20
          echo "::endgroup::"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Build with Theos
        if: steps.glue.outputs.ready == 'true'
        working-directory: ${{ env.P }}
        env:
          FINALPACKAGE: "1"
        run: |
          set -euo pipefail
          make clean || true
          make -k -j3 package FINALPACKAGE=1 messages=yes 2>&1 | tee "$WORK/theos.log" || {
            echo "::group::first errors"; grep -n -E "error:|undefined symbol|ld:" "$WORK/theos.log" | sed -e 's/\x1b\[[0-9;]*m//g' | cut -c1-260 | head -200; echo "::endgroup::"
            exit 1
          }
          ls -la packages

      - name: Pack .ipa
        if: steps.glue.outputs.ready == 'true'
        working-directory: ${{ env.P }}
        run: |
          set -euo pipefail
          APP=".theos/obj/NeedForSpeed3DO.app"; [ -d "$APP" ] || APP="$(find .theos -type d -name NeedForSpeed3DO.app | head -n1)"
          [ -n "$APP" ] || { echo "::error::NeedForSpeed3DO.app not found"; exit 1; }
          rm -rf ipa && mkdir -p ipa/Payload packages
          cp -a "$APP" ipa/Payload/
          (cd ipa && zip -rq ../packages/NeedForSpeed3DO-armv7.ipa Payload)
          ls -la packages

      - uses: actions/upload-artifact@v4
        if: steps.glue.outputs.ready == 'true'
        with:
          name: NeedForSpeed3DO-armv7-iOS7
          path: |
            ${{ env.P }}/packages/*.ipa
            ${{ env.P }}/packages/*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics
          path: |
            ${{ env.WORK }}/diag
            ${{ env.WORK }}/recomp.log
            ${{ env.WORK }}/theos.log
          if-no-files-found: ignore
