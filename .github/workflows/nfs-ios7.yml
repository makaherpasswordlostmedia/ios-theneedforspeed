name: NFS 3DO -> iOS 7 armv7 (single-file build)

# ONE file. Put it at .github/workflows/nfs-ios7.yml in YOUR FORK of pc-theneedforspeed (default branch), then Actions -> this workflow -> Run workflow. Nothing else to upload:
# the host code, Makefile and plist are written by the "Write project" step below.
# Your own disc: upload the ISO (2048-byte blocks, 327,980 blocks) to Google Drive,
# sharing "Anyone with the link", and paste its file ID (or save secret DRIVE_ISO_ID).
# No game data is ever committed or published; only the .ipa/.deb and diagnostics are uploaded.

on:
  workflow_dispatch:
    inputs:
      iso_file_id:
        description: "Drive file ID of your NFS 3DO .iso (empty = secret DRIVE_ISO_ID)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    name: NFS 3DO armv7 (Theos, iOS 7.0-9.3.5)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      WORK: ${{ github.workspace }}/work
      NFS: ${{ github.workspace }}
      P: ${{ github.workspace }}/work/proj
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential perl curl ca-certificates zip unzip xz-utils bzip2 git fakeroot make python3 python3-pip python3-venv
          mkdir -p "$WORK" "$P"
          python3 -m venv "$WORK/venv"
          "$WORK/venv/bin/pip" install -q gdown capstone

      - name: Fetch your disc image from Google Drive
        env:
          ISO_ID: ${{ inputs.iso_file_id || secrets.DRIVE_ISO_ID }}
        run: |
          set -euo pipefail
          [ -n "${ISO_ID:-}" ] || { echo "::error::No ISO ID. Fill iso_file_id or set secret DRIVE_ISO_ID."; exit 1; }
          mkdir -p "$NFS/iso"
          "$WORK/venv/bin/gdown" "$ISO_ID" -O "$NFS/iso/nfs.iso"
          printf 'FILE "nfs.iso" BINARY\n  TRACK 01 MODE1/2048\n    INDEX 01 00:00:00\n' > "$NFS/iso/nfs.cue"
          ls -la "$NFS/iso"

      - name: Extract disc and recompile (3dokit, from the repo README)
        working-directory: ${{ github.workspace }}
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -euo pipefail
          PY="$WORK/venv/bin/python"
          D=iso/nfs.cue
          "$PY" -m 3dokit.disc "$D" --verify || true
          "$PY" -m 3dokit.disc "$D" --extract build/disc
          "$PY" -m 3dokit.recomp --out build/recomp --optest \
            "launchme=build/disc/LaunchMe" "frontovl=build/disc/frontovl" \
            "lmadm=build/disc/System/Programs/LMADM" "format=build/disc/System/Programs/FORMAT" 2>&1 | tee "$WORK/recomp.log"
          ls build/recomp | head -50

      # The app boots the EXTRACTED disc from Documents/disc/ on the device (nothing of the game is inside the .ipa).
      # Download this artifact, unzip it and copy its contents into the app's Documents/disc/ (LaunchMe must end up
      # at Documents/disc/LaunchMe). It is your own disc's data: the artifact is private to this repo, delete it when done.
      - name: Upload extracted disc (copy into the app's Documents/disc/)
        uses: actions/upload-artifact@v4
        with:
          name: NFS-disc-for-Documents-disc
          path: ${{ github.workspace }}/build/disc
          retention-days: 3
          compression-level: 6
          if-no-files-found: error

      - name: Write project (host, Makefile, plist - all embedded in this file)
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$P/host/nfs_host.h")"
          cat > "$P/host/nfs_host.h" <<'NFS_EOF'
          /* nfs_host.h - the seam between the pfboot core (3dokit-recompiled NFS + Portfolio runtime)
           * and the iOS 7 / armv7 host. The core's SDL3 window/audio/pad layer is replaced by this.
           * Plain C so it links from both the C++ core and the Objective-C host. */
          #ifndef NFS_HOST_H
          #define NFS_HOST_H
          #include <stdint.h>
          #include <stdbool.h>
          #ifdef __cplusplus
          extern "C" {
          #endif

          /* 3DO control pad bits (nfs_pad_state). In NFS: A = throttle, R = gear up. */
          enum {  /* the runtime's own ControlPadEventData bits (pf_window.cpp), handed to pf_pad_live as is */
              NFS_PAD_DOWN = 0x80000000u, NFS_PAD_UP = 0x40000000u, NFS_PAD_RIGHT = 0x20000000u, NFS_PAD_LEFT = 0x10000000u,
              NFS_PAD_A = 0x08000000u, NFS_PAD_B = 0x04000000u, NFS_PAD_C = 0x02000000u, NFS_PAD_P = 0x01000000u, /* Play */
              NFS_PAD_X = 0x00800000u, /* Stop */ NFS_PAD_R = 0x00400000u, NFS_PAD_L = 0x00200000u
          };

          /* ---- the core implements these (pfboot's main loop, wrapped in core/nfs_core_glue.cpp) ---- */
          /* Boot the extracted disc tree (disc_dir holds LaunchMe, frontovl, ...) as the console does.
           * Blocks until the game quits. nvram_dir is formatted by the disc's own FORMAT when blank. */
          int  nfs_core_run(const char *disc_dir, const char *nvram_dir);
          /* Mix `frames` stereo frames, interleaved s16, 44100 Hz. Called from the audio thread. */
          void nfs_core_audio_mix(int16_t *out, int frames);

          /* ---- the host owns these; the core reads them ---- */
          extern volatile uint32_t nfs_pad_state;
          extern volatile int      nfs_paused;      /* 1 while the app is inactive: the core must idle */

          /* ---- the host implements these; the core calls them ---- */
          /* One finished field: w x h (w = 320), 3 bytes a pixel, R G B (pf_display_field). */
          void     nfs_host_present(const uint8_t *rgb, int w, int h);
          uint64_t nfs_host_time_ns(void);
          void     nfs_host_sleep_us(unsigned us);
          void     nfs_host_log(const char *fmt, ...);
          void     nfs_host_fatal(const char *msg);

          #ifdef __cplusplus
          }
          #endif
          #endif
          NFS_EOF
          mkdir -p "$(dirname "$P/host/ios_host.m")"
          cat > "$P/host/ios_host.m" <<'NFS_EOF'
          /* ios_host.m - UIKit / EAGL (GLES2) / AudioQueue host for the NFS (3DO) core.
           * iOS 7.0-9.3.5, armv7, ARC on. Structure from CrashBandicoot.Native/host/ios_host.m:
           * the emulation thread owns GL, touch overlay, MFi pad, pause on resign-active. */
          #import <UIKit/UIKit.h>
          #import <QuartzCore/QuartzCore.h>
          #import <OpenGLES/EAGL.h>
          #import <OpenGLES/ES2/gl.h>
          #import <OpenGLES/ES2/glext.h>
          #import <AudioToolbox/AudioToolbox.h>
          #import <AVFoundation/AVFoundation.h>
          #import <GameController/GameController.h>
          #include <stdarg.h>
          #include <pthread.h>
          #include <unistd.h>
          #include <sys/stat.h>
          #include <mach/mach_time.h>
          #include "nfs_host.h"

          volatile uint32_t nfs_pad_state;
          volatile int nfs_paused;

          /* ---------------------------------------------------------------- paths / log */
          static char g_docs[512], g_disc[600], g_nvram[600], g_logpath[600];
          static FILE *g_logf;
          static pthread_mutex_t g_log_mx = PTHREAD_MUTEX_INITIALIZER;

          void nfs_host_log(const char *fmt, ...)
          {
              pthread_mutex_lock(&g_log_mx);
              if (!g_logf && g_logpath[0]) g_logf = fopen(g_logpath, "a");
              va_list a; va_start(a, fmt);
              if (g_logf) { vfprintf(g_logf, fmt, a); fputc('\n', g_logf); fflush(g_logf); }
              va_end(a);
              pthread_mutex_unlock(&g_log_mx);
          }

          uint64_t nfs_host_time_ns(void)
          {
              static mach_timebase_info_data_t tb;
              if (tb.denom == 0) mach_timebase_info(&tb);
              uint64_t t = mach_absolute_time();
              return (tb.numer == tb.denom) ? t : t * tb.numer / tb.denom;
          }
          void nfs_host_sleep_us(unsigned us) { usleep(us); }

          /* ---------------------------------------------------------------- pad */
          static volatile uint32_t g_touch_mask, g_gc_mask;
          static void pad_recompute(void) { nfs_pad_state = g_touch_mask | g_gc_mask; }

          /* ---------------------------------------------------------------- GL */
          @interface GLView : UIView
          @end
          @implementation GLView
          + (Class)layerClass { return [CAEAGLLayer class]; }
          @end

          static GLView *g_glview;
          static EAGLContext *g_ctx;
          static GLuint g_fbo, g_rbo, g_prog, g_tex, g_vbo;
          static GLint g_vw, g_vh;
          static int g_tex_w, g_tex_h;

          static const char *VS =
              "attribute vec2 p; attribute vec2 t; varying mediump vec2 uv;"
              "void main(){ uv = t; gl_Position = vec4(p, 0.0, 1.0); }";
          /* the core hands RGB24 rows; uploaded as they are */
          static const char *FS =
              "varying mediump vec2 uv; uniform sampler2D s;"
              "void main(){ gl_FragColor = vec4(texture2D(s, uv).rgb, 1.0); }";

          static GLuint compile(GLenum type, const char *src)
          {
              GLuint s = glCreateShader(type);
              glShaderSource(s, 1, &src, NULL); glCompileShader(s);
              GLint ok = 0; glGetShaderiv(s, GL_COMPILE_STATUS, &ok);
              if (!ok) { char b[512]; glGetShaderInfoLog(s, sizeof b, NULL, b); nfs_host_log("[GL] shader: %s", b); }
              return s;
          }

          static void gl_setup(void)
          {
              __block CAEAGLLayer *layer = nil;
              dispatch_sync(dispatch_get_main_queue(), ^{
                  layer = (CAEAGLLayer *)g_glview.layer;
                  layer.opaque = YES;
                  layer.drawableProperties = @{ kEAGLDrawablePropertyRetainedBacking: @NO,
                                                kEAGLDrawablePropertyColorFormat: kEAGLColorFormatRGB565 };
              });
              g_ctx = [[EAGLContext alloc] initWithAPI:kEAGLRenderingAPIOpenGLES2];
              [EAGLContext setCurrentContext:g_ctx];
              glGenFramebuffers(1, &g_fbo); glGenRenderbuffers(1, &g_rbo);
              glBindFramebuffer(GL_FRAMEBUFFER, g_fbo); glBindRenderbuffer(GL_RENDERBUFFER, g_rbo);
              [g_ctx renderbufferStorage:GL_RENDERBUFFER fromDrawable:layer];
              glFramebufferRenderbuffer(GL_FRAMEBUFFER, GL_COLOR_ATTACHMENT0, GL_RENDERBUFFER, g_rbo);
              glGetRenderbufferParameteriv(GL_RENDERBUFFER, GL_RENDERBUFFER_WIDTH, &g_vw);
              glGetRenderbufferParameteriv(GL_RENDERBUFFER, GL_RENDERBUFFER_HEIGHT, &g_vh);

              g_prog = glCreateProgram();
              glAttachShader(g_prog, compile(GL_VERTEX_SHADER, VS));
              glAttachShader(g_prog, compile(GL_FRAGMENT_SHADER, FS));
              glBindAttribLocation(g_prog, 0, "p"); glBindAttribLocation(g_prog, 1, "t");
              glLinkProgram(g_prog); glUseProgram(g_prog);
              glUniform1i(glGetUniformLocation(g_prog, "s"), 0);

              /* 4:3 letterbox quad; full screen on a 4:3 iPad */
              float ar = (float)g_vw / (float)g_vh, sx = 1.f, sy = 1.f;
              if (ar > 4.f / 3.f) sx = (4.f / 3.f) / ar; else sy = ar / (4.f / 3.f);
              const float q[16] = { -sx,-sy, 0,1,   sx,-sy, 1,1,   -sx,sy, 0,0,   sx,sy, 1,0 };
              glGenBuffers(1, &g_vbo); glBindBuffer(GL_ARRAY_BUFFER, g_vbo);
              glBufferData(GL_ARRAY_BUFFER, sizeof q, q, GL_STATIC_DRAW);
              glEnableVertexAttribArray(0); glVertexAttribPointer(0, 2, GL_FLOAT, GL_FALSE, 16, (void *)0);
              glEnableVertexAttribArray(1); glVertexAttribPointer(1, 2, GL_FLOAT, GL_FALSE, 16, (void *)8);

              glGenTextures(1, &g_tex); glBindTexture(GL_TEXTURE_2D, g_tex);
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MIN_FILTER, GL_LINEAR);
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MAG_FILTER, GL_LINEAR);
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_S, GL_CLAMP_TO_EDGE);
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_T, GL_CLAMP_TO_EDGE);
              glDisable(GL_DEPTH_TEST); glDisable(GL_BLEND);
              nfs_host_log("[GL] screen %dx%d", g_vw, g_vh);
          }

          void nfs_host_present(const uint8_t *px, int w, int h)
          {
              while (nfs_paused) usleep(10000);            /* no GL while backgrounded: iOS kills the app */
              if (!g_ctx) gl_setup();
              [EAGLContext setCurrentContext:g_ctx];
              glBindFramebuffer(GL_FRAMEBUFFER, g_fbo);
              glViewport(0, 0, g_vw, g_vh);
              glClearColor(0, 0, 0, 1); glClear(GL_COLOR_BUFFER_BIT);
              glActiveTexture(GL_TEXTURE0); glBindTexture(GL_TEXTURE_2D, g_tex);
              glPixelStorei(GL_UNPACK_ALIGNMENT, 1);
              if (w != g_tex_w || h != g_tex_h) {
                  glTexImage2D(GL_TEXTURE_2D, 0, GL_RGB, w, h, 0, GL_RGB, GL_UNSIGNED_BYTE, px);
                  g_tex_w = w; g_tex_h = h;
              } else {
                  glTexSubImage2D(GL_TEXTURE_2D, 0, 0, 0, w, h, GL_RGB, GL_UNSIGNED_BYTE, px);
              }
              glDrawArrays(GL_TRIANGLE_STRIP, 0, 4);
              glBindRenderbuffer(GL_RENDERBUFFER, g_rbo);
              [g_ctx presentRenderbuffer:GL_RENDERBUFFER];
          }

          /* ---------------------------------------------------------------- audio */
          #define AUDIO_FRAMES 1024
          static AudioQueueRef g_aq;
          static void aq_cb(void *ud, AudioQueueRef q, AudioQueueBufferRef b)
          {
              nfs_core_audio_mix((int16_t *)b->mAudioData, AUDIO_FRAMES);
              b->mAudioDataByteSize = AUDIO_FRAMES * 4;
              AudioQueueEnqueueBuffer(q, b, 0, NULL);
          }
          static void audio_start(void)
          {
              [[AVAudioSession sharedInstance] setCategory:AVAudioSessionCategoryPlayback error:nil];
              [[AVAudioSession sharedInstance] setActive:YES error:nil];
              AudioStreamBasicDescription f = {0};
              f.mSampleRate = 44100; f.mFormatID = kAudioFormatLinearPCM;
              f.mFormatFlags = kAudioFormatFlagIsSignedInteger | kAudioFormatFlagIsPacked;
              f.mBitsPerChannel = 16; f.mChannelsPerFrame = 2; f.mBytesPerFrame = 4;
              f.mFramesPerPacket = 1; f.mBytesPerPacket = 4;
              if (AudioQueueNewOutput(&f, aq_cb, NULL, NULL, NULL, 0, &g_aq) != noErr) { nfs_host_log("[AUDIO] failed"); return; }
              for (int i = 0; i < 4; i++) {
                  AudioQueueBufferRef b; AudioQueueAllocateBuffer(g_aq, AUDIO_FRAMES * 4, &b);
                  memset(b->mAudioData, 0, AUDIO_FRAMES * 4); b->mAudioDataByteSize = AUDIO_FRAMES * 4;
                  AudioQueueEnqueueBuffer(g_aq, b, 0, NULL);
              }
              AudioQueueStart(g_aq, NULL);
          }

          /* ---------------------------------------------------------------- touch overlay */
          typedef struct { uint32_t mask; CGPoint c; CGFloat r; const char *label; } Btn;

          @interface PadView : UIView
          @end
          @implementation PadView { Btn _b[8]; int _n; CGPoint _dp; CGFloat _dr; }
          - (instancetype)initWithFrame:(CGRect)f
          {
              if ((self = [super initWithFrame:f])) {
                  self.multipleTouchEnabled = YES; self.opaque = NO;
                  self.backgroundColor = [UIColor clearColor];
              }
              return self;
          }
          /* Racing layout: steering pad left; gas (A) / brake (B) / C right; shift L/R on the top corners;
           * Play (P) and Stop (X) bottom centre. */
          - (void)layoutSubviews
          {
              CGFloat W = self.bounds.size.width, H = self.bounds.size.height, u = MIN(W, H) / 768.0;
              _dp = CGPointMake(190 * u, H - 190 * u); _dr = 120 * u;
              CGFloat fx = W - 190 * u;
              _n = 0;
              _b[_n++] = (Btn){ NFS_PAD_A, CGPointMake(fx + 60 * u, H - 230 * u), 62 * u, "A" };
              _b[_n++] = (Btn){ NFS_PAD_B, CGPointMake(fx - 80 * u, H - 130 * u), 46 * u, "B" };
              _b[_n++] = (Btn){ NFS_PAD_C, CGPointMake(fx - 90 * u, H - 270 * u), 40 * u, "C" };
              _b[_n++] = (Btn){ NFS_PAD_L, CGPointMake(90 * u, 70 * u), 50 * u, "L" };
              _b[_n++] = (Btn){ NFS_PAD_R, CGPointMake(W - 90 * u, 70 * u), 50 * u, "R" };
              _b[_n++] = (Btn){ NFS_PAD_P, CGPointMake(W / 2 + 70 * u, H - 40 * u), 34 * u, "P" };
              _b[_n++] = (Btn){ NFS_PAD_X, CGPointMake(W / 2 - 70 * u, H - 40 * u), 34 * u, "X" };
              [self setNeedsDisplay];
          }
          - (void)drawRect:(CGRect)r
          {
              CGContextRef g = UIGraphicsGetCurrentContext();
              CGContextSetRGBStrokeColor(g, 1, 1, 1, 0.45); CGContextSetRGBFillColor(g, 1, 1, 1, 0.10);
              CGContextSetLineWidth(g, 2);
              CGContextAddEllipseInRect(g, CGRectMake(_dp.x - _dr, _dp.y - _dr, _dr * 2, _dr * 2));
              CGContextDrawPath(g, kCGPathFillStroke);
              for (int i = 0; i < _n; i++) {
                  CGContextAddEllipseInRect(g, CGRectMake(_b[i].c.x - _b[i].r, _b[i].c.y - _b[i].r, _b[i].r * 2, _b[i].r * 2));
                  CGContextDrawPath(g, kCGPathFillStroke);
                  NSString *s = [NSString stringWithUTF8String:_b[i].label];
                  NSDictionary *at = @{ NSFontAttributeName: [UIFont boldSystemFontOfSize:MAX(12, _b[i].r * 0.55)],
                                        NSForegroundColorAttributeName: [UIColor colorWithWhite:1 alpha:0.6] };
                  CGSize z = [s sizeWithAttributes:at];
                  [s drawAtPoint:CGPointMake(_b[i].c.x - z.width / 2, _b[i].c.y - z.height / 2) withAttributes:at];
              }
          }
          - (void)recompute:(NSSet *)all
          {
              uint32_t m = 0;
              for (UITouch *t in all) {
                  if (t.phase == UITouchPhaseEnded || t.phase == UITouchPhaseCancelled) continue;
                  CGPoint p = [t locationInView:self];
                  CGFloat dx = p.x - _dp.x, dy = p.y - _dp.y, d = hypot(dx, dy);
                  if (d < _dr * 1.3 && d > _dr * 0.15) {
                      CGFloat a = atan2(dy, dx);
                      if (cos(a) > 0.38) m |= NFS_PAD_RIGHT;
                      if (cos(a) < -0.38) m |= NFS_PAD_LEFT;
                      if (sin(a) > 0.38) m |= NFS_PAD_DOWN;
                      if (sin(a) < -0.38) m |= NFS_PAD_UP;
                  }
                  for (int i = 0; i < _n; i++)
                      if (hypot(p.x - _b[i].c.x, p.y - _b[i].c.y) <= _b[i].r * 1.25) m |= _b[i].mask;
              }
              g_touch_mask = m; pad_recompute();
          }
          - (void)touchesBegan:(NSSet *)t withEvent:(UIEvent *)e { [self recompute:[e allTouches]]; }
          - (void)touchesMoved:(NSSet *)t withEvent:(UIEvent *)e { [self recompute:[e allTouches]]; }
          - (void)touchesEnded:(NSSet *)t withEvent:(UIEvent *)e { [self recompute:[e allTouches]]; }
          - (void)touchesCancelled:(NSSet *)t withEvent:(UIEvent *)e { [self recompute:[e allTouches]]; }
          @end

          /* ---------------------------------------------------------------- MFi pad */
          static void gc_attach(GCController *c)
          {
              GCExtendedGamepad *x = c.extendedGamepad;
              if (!x) return;
              x.valueChangedHandler = ^(GCExtendedGamepad *p, GCControllerElement *el) {
                  uint32_t m = 0;
                  if (p.dpad.up.pressed) m |= NFS_PAD_UP;
                  if (p.dpad.down.pressed) m |= NFS_PAD_DOWN;
                  if (p.dpad.left.pressed || p.leftThumbstick.left.value > 0.4) m |= NFS_PAD_LEFT;
                  if (p.dpad.right.pressed || p.leftThumbstick.right.value > 0.4) m |= NFS_PAD_RIGHT;
                  if (p.buttonA.pressed || p.rightTrigger.value > 0.3) m |= NFS_PAD_A;   /* gas */
                  if (p.buttonB.pressed || p.leftTrigger.value > 0.3) m |= NFS_PAD_B;    /* brake */
                  if (p.buttonX.pressed) m |= NFS_PAD_C;
                  if (p.buttonY.pressed) m |= NFS_PAD_P;
                  if (p.leftShoulder.pressed) m |= NFS_PAD_L;
                  if (p.rightShoulder.pressed) m |= NFS_PAD_R;
                  g_gc_mask = m; pad_recompute();
              };
          }

          /* ---------------------------------------------------------------- fatal */
          void nfs_host_fatal(const char *msg)
          {
              nfs_host_log("[FATAL] %s", msg);
              NSString *s = [NSString stringWithUTF8String:msg];
              dispatch_async(dispatch_get_main_queue(), ^{
                  UIAlertView *a = [[UIAlertView alloc] initWithTitle:@"Need for Speed" message:s delegate:nil
                                                    cancelButtonTitle:@"OK" otherButtonTitles:nil];
                  [a show];
              });
              nfs_paused = 1; if (g_aq) AudioQueuePause(g_aq);
              for (;;) sleep(3600);
          }

          /* ---------------------------------------------------------------- app */
          @interface RootVC : UIViewController
          @end
          @implementation RootVC
          - (BOOL)prefersStatusBarHidden { return YES; }
          - (NSUInteger)supportedInterfaceOrientations { return UIInterfaceOrientationMaskLandscape; }
          - (BOOL)shouldAutorotate { return YES; }
          - (void)loadView
          {
              CGRect b = [UIScreen mainScreen].bounds;
              if (b.size.width < b.size.height) b = CGRectMake(0, 0, b.size.height, b.size.width);
              UIView *root = [[UIView alloc] initWithFrame:b]; root.backgroundColor = [UIColor blackColor];
              g_glview = [[GLView alloc] initWithFrame:b];
              g_glview.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              [root addSubview:g_glview];
              PadView *pad = [[PadView alloc] initWithFrame:b];
              pad.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              [root addSubview:pad];
              self.view = root;
          }
          @end

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end
          @implementation AppDelegate
          - (void)emuMain:(id)arg
          {
              @autoreleasepool { audio_start(); }
              int rc = nfs_core_run(g_disc, g_nvram);
              nfs_host_fatal(rc ? "core stopped with an error (see nfs.log)" : "game returned");
          }
          - (BOOL)application:(UIApplication *)app didFinishLaunchingWithOptions:(NSDictionary *)opts
          {
              NSString *docs = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES)[0];
              snprintf(g_docs, sizeof g_docs, "%s", docs.UTF8String);
              snprintf(g_disc, sizeof g_disc, "%s/disc", g_docs);       /* the extracted disc tree */
              snprintf(g_nvram, sizeof g_nvram, "%s/nvram", g_docs);
              snprintf(g_logpath, sizeof g_logpath, "%s/nfs.log", g_docs);
              mkdir(g_nvram, 0755);

              self.window = [[UIWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
              self.window.rootViewController = [RootVC new];
              [self.window makeKeyAndVisible];
              app.idleTimerDisabled = YES;
              [[NSNotificationCenter defaultCenter] addObserverForName:GCControllerDidConnectNotification object:nil
                  queue:nil usingBlock:^(NSNotification *n) { gc_attach(n.object); }];
              for (GCController *c in [GCController controllers]) gc_attach(c);

              char probe[700]; snprintf(probe, sizeof probe, "%s/LaunchMe", g_disc);
              if (access(probe, R_OK) != 0) {
                  UILabel *l = [[UILabel alloc] initWithFrame:self.window.bounds];
                  l.numberOfLines = 0; l.textAlignment = NSTextAlignmentCenter; l.textColor = [UIColor whiteColor];
                  l.text = @"Put the extracted disc tree of your own\nThe Need for Speed (3DO) into\nDocuments/disc/ (LaunchMe, frontovl, ...)\nand relaunch.";
                  [self.window.rootViewController.view addSubview:l];
                  return YES;
              }
