          cat > "$P/core/nfs_core_glue.cpp" <<'NFS_EOF'
          // nfs_core_glue.cpp - the iOS stand-in for 3dokit/runtime/pf_window.cpp (SDL3), and the two
          // entry points host/ios_host.m calls. pf_main.cpp is built with -Dmain=pf_boot_main -DTDK_WINDOW=1,
          // so `pfboot DISC --boot --window` ends up in pf_window_run() below instead of SDL.
          //   video: the program's thread hands a field over at each vertical blank; a render thread
          //          (the only one that touches GL) shows the latest one through nfs_host_present().
          //   audio: pf_dsp pushes frames at the rate they play (g_pf_audio_out); the AudioQueue pulls them
          //          from a ring in nfs_core_audio_mix().
          //   pad:   nfs_pad_state holds the runtime's own button bits; handed to pf_pad_live every field.
          #include "pf.h"
          #include "nfs_host.h"
          #include <atomic>
          #include <chrono>
          #include <functional>
          #include <mutex>
          #include <string>
          #include <thread>
          #include <vector>

          extern int pf_boot_main(int argc, char** argv);      // pf_main.cpp's main()

          namespace {

          // ---- audio ring: one producer (the program), one consumer (the AudioQueue) ----
          constexpr size_t kRing = 1u << 15;                   // stereo frames, power of two
          int16_t g_ring[kRing * 2];
          std::atomic<size_t> g_w{0}, g_r{0};                  // free-running frame counters
          bool g_primed;

          void window_audio(const int16_t* lr, size_t frames) {
              if (!g_primed) { g_primed = true; g_w.store(2646); }   // 60 ms of silence as the margin, as the SDL window did
              size_t w = g_w.load(std::memory_order_relaxed), r = g_r.load(std::memory_order_acquire);
              if (w - r > 44100 / 2 || w - r + frames > kRing) return;   // half a second queued: drop, the SDL window cleared its queue
              for (size_t i = 0; i < frames; ++i) {
                  size_t k = (w + i) & (kRing - 1);
                  g_ring[k * 2] = lr[i * 2];
                  g_ring[k * 2 + 1] = lr[i * 2 + 1];
              }
              g_w.store(w + frames, std::memory_order_release);
          }

          // ---- video: the latest field, and the pace ----
          std::mutex g_lock;
          std::vector<uint8_t> g_rgb;
          int g_lines;
          uint64_t g_seq;
          std::atomic<bool> g_stop{false};

          using Clock = std::chrono::steady_clock;
          Clock::time_point g_host0;
          uint64_t g_guest0;
          bool g_started;

          // The program's thread, at each vertical blank (pf_window.cpp's window_vbl).
          void window_vbl(uint64_t when) {
              std::vector<uint8_t> rgb;
              int lines;
              if (pf_display_field(rgb, lines)) {
                  std::lock_guard<std::mutex> l(g_lock);
                  g_rgb.swap(rgb);
                  g_lines = lines;
                  ++g_seq;
              }
              pf_pad_live(nfs_pad_state);
              if (nfs_paused) {                                // backgrounded: hold the guest, count the clock again after
                  while (nfs_paused) nfs_host_sleep_us(10000);
                  g_started = false;
              }
              Clock::time_point now = Clock::now();
              if (!g_started) {
                  g_started = true;
                  g_host0 = now;
                  g_guest0 = when;
                  return;
              }
              Clock::time_point due = g_host0 + std::chrono::nanoseconds(when - g_guest0);
              if (due > now) std::this_thread::sleep_until(due);
              else if (now - due > std::chrono::milliseconds(100)) {   // fell behind: count again from here
                  g_host0 = now;
                  g_guest0 = when;
              }
          }

          void render_loop() {
              std::vector<uint8_t> rgb;
              uint64_t shown = 0;
              while (!g_stop) {
                  int lines = 0;
                  {
                      std::lock_guard<std::mutex> l(g_lock);
                      if (g_seq != shown) { shown = g_seq; rgb = g_rgb; lines = g_lines; }
                  }
                  if (lines) nfs_host_present(rgb.data(), 320, lines);
                  nfs_host_sleep_us(4000);
              }
          }

          }  // namespace

          // pf_main.cpp calls this (TDK_WINDOW) with the program's boot and run in `run`.
          int pf_window_run(const char* title, const char* record, const std::function<int()>& run) {
              (void)title; (void)record;                       // no --record on iOS
              g_pf_audio_out = window_audio;
              g_pf_display_vbl = window_vbl;
              g_pf_wait_forever = true;
              std::thread render(render_loop);
              int r = run();
              g_stop = true;
              render.join();
              return r;
          }

          extern "C" int nfs_core_run(const char* disc_dir, const char* nvram_dir) {
              std::string d(disc_dir), n(nvram_dir);
              std::vector<char*> a = { (char*)"pfboot", &d[0], (char*)"--boot", (char*)"--trace", (char*)"0",
                                       (char*)"--nvram", &n[0], (char*)"--window" };
              return pf_boot_main((int)a.size(), a.data());
          }

          extern "C" void nfs_core_audio_mix(int16_t* out, int frames) {
              size_t r = g_r.load(std::memory_order_relaxed), w = g_w.load(std::memory_order_acquire);
              size_t n = w - r < (size_t)frames ? w - r : (size_t)frames;
              for (size_t i = 0; i < n; ++i) {
                  size_t k = (r + i) & (kRing - 1);
                  out[i * 2] = g_ring[k * 2];
                  out[i * 2 + 1] = g_ring[k * 2 + 1];
              }
              for (size_t i = n * 2; i < (size_t)frames * 2; ++i) out[i] = 0;
              g_r.store(r + n, std::memory_order_release);
          }
          NFS_EOF
          cat > "$P/core/fstream_inst.cpp" <<'NFS_EOF'
          // fstream_inst.cpp - the toolchain's modern <fstream> declares basic_filebuf/ifstream/ofstream<char> as
          // `extern template`, expecting the dylib to define them. The iOS 7-9.3 libc++.dylib does not export these
          // (link error: basic_filebuf::open / ctor / dtor, ifstream/ofstream vtable + VTT), so instantiate them here.
          #include <fstream>
          template class std::basic_filebuf<char>;
          template class std::basic_ifstream<char>;
          template class std::basic_ofstream<char>;
